# https://github.com/ram133/ray.services/.github/workflows/market.yml
name: 24-7 Market Automation

on:
  schedule:
    # Runs every 30 minutes (balanced for Free Tier)
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  execute-logic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Market Analysis
        run: python market.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name "RayNV-Bot"
          git config --global user.email "bot@ray.services"
          git add .
          git commit -m "Automated sync [skip ci]" || exit 0
          git push

